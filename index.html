<style>
:root{
  --creme:#FFF6E9; --creme2:#FFEBD0; --karte:#FFFFFF; --braun:#4A3426; --braun2:#7A5C48;
  --gelb:#FFC93C; --orange:#FF9F4A; --koralle:#FF7A5C; --gruen:#7BC47F; --blau:#5DB7DE; --lila:#B58BE0;
  --schatten:0 6px 18px rgba(120,80,40,.14); --r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--creme);color:var(--braun);font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.4}
#app{display:flex;min-height:100%}
nav{width:104px;background:var(--creme2);padding:14px 8px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;flex:none}
nav .logo{display:flex;justify-content:center;margin-bottom:6px}
nav button{border:0;background:transparent;border-radius:16px;padding:10px 4px;color:var(--braun2);font:inherit;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button .ic{font-size:26px;line-height:1}
nav button.on{background:var(--karte);color:var(--braun);box-shadow:var(--schatten);font-weight:700}
main{flex:1;min-width:0;padding:24px 28px 60px;max-width:1180px}
h1{margin:0 0 4px;font-size:30px}
h2{margin:0 0 10px;font-size:21px}
.sub{color:var(--braun2);margin:0 0 18px}
.card{background:var(--karte);border-radius:var(--r);box-shadow:var(--schatten);padding:18px 20px;margin-bottom:16px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.btn{border:0;border-radius:999px;background:var(--koralle);color:#fff;font:inherit;font-weight:700;padding:12px 22px;cursor:pointer;box-shadow:0 4px 0 #d9583c}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #d9583c}
.btn.soft{background:var(--creme2);color:var(--braun);box-shadow:0 4px 0 #e6cfae}
.chip{display:inline-block;border-radius:999px;padding:3px 11px;font-size:14px;background:var(--creme2)}
.chip.warn{background:#FFD9CF;color:#a0361d;font-weight:700}
.chip.ok{background:#DDF1DE;color:#2f6b33}
input[type=text],input[type=number],input[type=url]{font:inherit;color:var(--braun);border:2px solid var(--creme2);border-radius:14px;padding:9px 12px;background:#fff;min-width:0}
input:focus{outline:none;border-color:var(--orange)}
.hint{font-size:14px;color:var(--braun2)}
.demo{position:fixed;right:12px;bottom:10px;background:var(--braun);color:#fff;border-radius:999px;font-size:13px;padding:6px 14px;opacity:.88;z-index:50}
.bubble{position:relative;background:#fff;border-radius:20px;padding:14px 18px;box-shadow:var(--schatten);max-width:520px}
.bubble:before{content:"";position:absolute;left:-10px;top:26px;border:10px solid transparent;border-right-color:#fff;border-left:0}
.ente-row{display:flex;gap:20px;align-items:center;margin-bottom:18px}
.zaehler{height:16px;border-radius:99px;background:var(--creme2);overflow:hidden}
.zaehler i{display:block;height:100%;background:linear-gradient(90deg,var(--gelb),var(--orange));border-radius:99px}
/* Kühlschrank */
.foto{width:100%;max-width:420px;aspect-ratio:3/4;border-radius:24px;background:linear-gradient(#e8f3f8,#cfe4ee);display:flex;align-items:center;justify-content:center;box-shadow:var(--schatten)}
.zeile{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--creme2)}
.zeile:last-child{border:0}
.zeile .n{flex:1}
.rezept{display:flex;gap:14px;align-items:flex-start}
.rezept .bild{font-size:44px;background:var(--creme2);border-radius:18px;width:72px;height:72px;display:flex;align-items:center;justify-content:center;flex:none}
/* Wochenplan */
.palette{display:flex;gap:12px;flex-wrap:wrap;padding:14px;background:var(--creme2);border-radius:var(--r);margin-bottom:14px;align-items:center}
.palette .t{font-weight:700;margin-right:6px}
.woche{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.tag{background:#fff;border-radius:18px;box-shadow:var(--schatten);padding:8px;min-height:300px;display:flex;flex-direction:column;gap:8px}
.tag h3{margin:0;text-align:center;font-size:15px;color:var(--braun2)}
.dayzone{flex:1;display:flex;flex-direction:column;gap:8px;min-height:240px;border-radius:12px;transition:background .12s}
.dayzone.over{background:#FFF1DC;outline:2px dashed var(--orange)}
.block{--c:var(--gruen);position:relative;background:var(--c);border-radius:14px;padding:8px 8px 8px 8px;color:#2b1a10;display:flex;flex-direction:column;gap:5px;box-shadow:0 3px 0 rgba(0,0,0,.18);user-select:none;-webkit-user-select:none}
.block:before{content:"";position:absolute;top:-5px;left:16px;width:22px;height:7px;background:var(--c);border-radius:5px 5px 0 0}
.block.einkaufen{--c:var(--gruen)}.block.kochen{--c:var(--orange)}.block.mensa{--c:var(--blau)}.block.sonstiges{--c:var(--lila)}
.block .kopf{display:flex;align-items:center;gap:4px;font-weight:800;font-size:13.5px;white-space:nowrap;padding-right:8px}
.block .grip{touch-action:none;cursor:grab;opacity:.55;font-size:18px;letter-spacing:-3px;padding:0 2px}
.block .x{position:absolute;top:-9px;right:-7px;border:0;background:#fff;border-radius:50%;width:24px;height:24px;font-size:13px;cursor:pointer;color:#2b1a10;box-shadow:0 2px 5px rgba(0,0,0,.25);padding:0}
.block textarea{width:100%;border:0;border-radius:10px;padding:6px 8px;font:inherit;font-size:14px;line-height:1.25;background:rgba(255,255,255,.88);resize:none;min-height:50px;color:#2b1a10}
.block textarea:focus{outline:2px solid #fff}
.block.pal{cursor:grab;touch-action:none;min-width:170px;padding:10px 12px}
.block.pal .kopf{font-size:17px;padding-right:0}
.ghost{position:fixed;z-index:100;pointer-events:none;width:170px;opacity:.92;transform:rotate(-3deg)}
.leer{color:#b79a82;font-size:13px;text-align:center;padding:10px 4px}
/* Profil */
.reiter{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;padding-bottom:4px}
.pzeile{display:flex;gap:10px;flex-wrap:wrap;padding-top:10px}
.pzeile #pname,.pzeile #pprod{flex:1 1 100%}
.pzeile #plink{flex:1 1 160px}
.pzeile #pdatum{flex:1;min-width:0}
.reiter button,.wahl button,.mensen button{border:0;font:inherit;color:var(--braun);background:var(--creme2);border-radius:999px;padding:10px 16px;cursor:pointer;white-space:nowrap;flex:none}
.reiter button.on{background:var(--koralle);color:#fff;font-weight:700;box-shadow:0 3px 0 #d9583c}
.wahl{display:flex;gap:8px;flex-wrap:wrap}
.wahl button.on,.mensen button.on{background:var(--gelb);font-weight:700;box-shadow:0 3px 0 #e0a91f}
.mensen{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:8px}
.mensen button{border-radius:16px;text-align:left;padding:14px 16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.knoepfe{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.knoepfe label.btn{position:relative;overflow:hidden;cursor:pointer}
a.btn{text-decoration:none;display:inline-block}
.grid.zwei{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px}
.rb{margin:0;text-align:center}
.rbz{font-size:30px;font-weight:800;line-height:1.2}
.versteckt{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.kvorschau{display:block;max-width:100%;max-height:260px;border-radius:16px;margin:0 0 14px;box-shadow:var(--schatten)}
.krezept details summary{cursor:pointer;font-weight:700}
.krezept ol{margin:8px 0 0;padding-left:22px;line-height:1.5}
#main a{color:#c2452a;font-weight:700;text-underline-offset:3px}
.btn[disabled]{opacity:.6;cursor:default}
.chip .cx{border:0;background:rgba(255,255,255,.7);border-radius:50%;width:22px;height:22px;font-size:11px;margin-left:4px;cursor:pointer;color:inherit;padding:0}
.chips .chip{font-size:15px;padding:5px 8px 5px 13px}
input[type=date]{font:inherit;color:var(--braun);border:2px solid var(--creme2);border-radius:14px;padding:8px 10px;background:#fff;min-height:44px}
@media(max-width:900px){
  #app{flex-direction:column-reverse}
  nav{width:100%;height:auto;flex-direction:row;position:sticky;bottom:0;top:auto;justify-content:space-around;padding:6px}
  nav .logo{display:none}
  .demo{bottom:78px;right:8px;font-size:11px;padding:4px 10px}
  nav button{flex:1;font-size:11px;padding:6px 2px}
  main{padding:16px 14px 90px}
  .woche{grid-template-columns:repeat(7,150px);overflow-x:auto;padding-bottom:10px}
  .ente-row{flex-direction:column;align-items:flex-start}
  .bubble:before{display:none}
}
/* Begrüßung */
#hallo{position:fixed;inset:0;background:rgba(74,52,38,.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
#hallo .karte{background:var(--creme);border-radius:30px;padding:28px 30px;max-width:460px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35)}
#hallo h1{font-size:28px}
</style>
<style>
/* Ergänzungen für die echte App */
nav{padding-bottom:max(14px,env(safe-area-inset-bottom))}
@media(max-width:900px){ nav{padding-bottom:max(6px,env(safe-area-inset-bottom))} main{padding-bottom:110px} .block textarea,.block select,input[type=text],input[type=url],input[type=date]{font-size:16px} }
.block select{width:100%;border:0;border-radius:10px;padding:6px 6px;font:inherit;font-size:14px;background:rgba(255,255,255,.88);color:#2b1a10}
.minfo{border:0;background:rgba(255,255,255,.55);border-radius:10px;font:inherit;font-size:12.5px;padding:4px 6px;color:#2b1a10;text-align:left;cursor:pointer}
.mensen button.klein{padding:9px 12px;font-size:15px}
.tage{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.tage button{border:0;font:inherit;background:#fff;border-radius:14px;padding:8px 12px;box-shadow:var(--schatten);cursor:pointer;color:var(--braun)}
.tage button.on{background:var(--blau);color:#fff;font-weight:700}
.gericht{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.gericht .preis{font-weight:800;font-size:19px;white-space:nowrap}
.heute{display:flex;gap:8px;flex-wrap:wrap}
.heute .chip{font-size:15px;padding:6px 12px}
.ezeile select{font:inherit;color:var(--braun);border:2px solid var(--creme2);border-radius:14px;padding:8px;background:#fff}
.bald{opacity:.75}
.mzeile{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:6px;-webkit-overflow-scrolling:touch}
.mzeile button{flex:none}
.gericht h2{font-size:18px}
@media(max-width:900px){
  .palette{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
  .palette .t{grid-column:1/-1}
  .block.pal{min-width:0;padding:9px 10px}
  .block.pal .kopf{font-size:15px}
  .gericht h2{font-size:16.5px}
}
</style>

<body>
<div id="app">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div id="hallo"></div>

<script>
/* ---------- Reine Logik (ohne Bildschirm; wird mit Node getestet: node test_plan.js) ---------- */
const TAGE = ['Mo','Di','Mi','Do','Fr','Sa','So'];
const TYPEN = {
  einkaufen:{label:'Einkaufen',icon:'🛒',platz:'Wo / was?'},
  kochen:{label:'Kochen',icon:'🍳',platz:'Was kochst du?'},
  mensa:{label:'Mensa',icon:'🍽️',platz:'Welche Mensa?'},
  sonstiges:{label:'Sonstiges',icon:'✏️',platz:'Was steht an?'}
};
let naechsteId = 1;
function neuerBlock(typ, text){
  if(!TYPEN[typ]) throw new Error('Unbekannter Baustein: '+typ);
  // Zeit + Zähler: bleibt eindeutig, auch nach dem Neuladen gespeicherter Pläne
  return {id:'b'+Date.now().toString(36)+'_'+(naechsteId++), typ, text:text||''};
}
function leererPlan(){ const p={}; TAGE.forEach(t=>p[t]=[]); return p; }
function findeBlock(plan,id){
  for(const t of TAGE){ const i=plan[t].findIndex(b=>b.id===id); if(i>=0) return {tag:t,index:i}; }
  return null;
}
function einfuegen(plan,tag,index,block){
  if(!plan[tag]) throw new Error('Unbekannter Tag: '+tag);
  const i=Math.max(0,Math.min(index,plan[tag].length));
  plan[tag].splice(i,0,block); return plan;
}
function verschieben(plan,id,tag,index){
  const f=findeBlock(plan,id); if(!f) return plan;
  const [b]=plan[f.tag].splice(f.index,1);
  let i=index; if(f.tag===tag && f.index<index) i=index-1;
  return einfuegen(plan,tag,i,b);
}
function entfernen(plan,id){ const f=findeBlock(plan,id); if(f) plan[f.tag].splice(f.index,1); return plan; }
function zaehle(plan){ const z={einkaufen:0,kochen:0,mensa:0,sonstiges:0}; TAGE.forEach(t=>plan[t].forEach(b=>z[b.typ]++)); return z; }

function fuegeHinzu(liste, wort){
  const w=String(wort==null?'':wort).trim().replace(/\s+/g,' ');
  if(!w || liste.some(x=>x.toLowerCase()===w.toLowerCase())) return false;
  liste.push(w); return true;
}
function tageBis(iso, heute){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(iso||'')) return NaN;
  const [y,m,d]=iso.split('-').map(Number);
  return Math.round((Date.UTC(y,m-1,d)-Date.UTC(heute.getFullYear(),heute.getMonth(),heute.getDate()))/86400000);
}
function naechstePruefung(liste, heute){
  return liste.map(p=>Object.assign({},p,{tage:tageBis(p.d,heute)})).filter(p=>p.tage>=0).sort((a,b)=>a.tage-b.tage)[0]||null;
}

/* Datum: alles in Ortszeit, als Text "JJJJ-MM-TT" */
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function montagVon(h){ const d=new Date(h.getFullYear(),h.getMonth(),h.getDate()); d.setDate(d.getDate()-((d.getDay()+6)%7)); return d; }
function tagHeute(h){ return TAGE[(h.getDay()+6)%7]; }
function datumFuerTag(tag,h){ const i=TAGE.indexOf(tag); if(i<0) throw new Error('Unbekannter Tag: '+tag); const d=montagVon(h); d.setDate(d.getDate()+i); return iso(d); }
function tagVonDatum(s){ const [y,m,d]=s.split('-').map(Number); return TAGE[(new Date(y,m-1,d).getDay()+6)%7]; }

/* Geld */
function parsePreis(s){
  const t=String(s==null?'':s).replace('€','').trim().replace(',','.');
  if(!t) return null;                                   // kein Preis = erlaubt
  if(!/^\d+(\.\d{1,2})?$/.test(t)) return NaN;           // Unsinn
  const v=Number(t); return v<10000 ? v : NaN;
}
function ausgegeben(einkauf){ return Math.round(einkauf.filter(x=>x.done && typeof x.p==='number').reduce((a,x)=>a+x.p,0)*100)/100; }
// Texte aller Bausteine einer Sorte im Wochenplan (leere Bausteine zählen als '')
function planTexte(plan,typ){ const a=[]; if(!plan||typeof plan!=="object") return a; TAGE.forEach(t=>(plan[t]||[]).forEach(b=>{ if(b.typ===typ) a.push(String(b.text||'').trim().slice(0,120)); })); return a; }
// Neue Woche? Dann alte Woche für den Rückblick merken und Abgehaktes wegräumen
function neueWoche(st,h){
  const k=iso(montagVon(h)); if(st.woche===k) return false;
  if(st.woche) st.verlauf.push({woche:st.woche, ausgegeben:ausgegeben(st.einkauf), budget:st.ziel, kochen:planTexte(st.plan,'kochen'), mensa:planTexte(st.plan,'mensa')});
  st.einkauf=st.einkauf.filter(x=>!x.done); st.woche=k; return true;
}
/* Kochjahr-Rückblick: alte Wochen + laufende Woche zusammenzählen */
function haeufigstes(liste){
  const z={}, erst={}; liste.forEach(x=>{ const t=String(x||'').trim(); if(!t) return; const k=t.toLowerCase(); z[k]=(z[k]||0)+1; if(!erst[k]) erst[k]=t; });
  let best=null; Object.keys(z).forEach(k=>{ if(!best||z[k]>z[best]) best=k; });
  return best?{n:erst[best],x:z[best]}:null;
}
function rueckblick(st){
  const V=Array.isArray(st.verlauf)?st.verlauf:[], arr=a=>Array.isArray(a)?a:[];
  const kochen=V.flatMap(v=>arr(v.kochen)).concat(planTexte(st.plan,'kochen'));
  const mensa=V.flatMap(v=>arr(v.mensa)).concat(planTexte(st.plan,'mensa'));
  const mitEinkauf=V.filter(v=>typeof v.ausgegeben==='number'&&v.ausgegeben>0&&typeof v.budget==='number');
  const gespart=Math.round(mitEinkauf.reduce((a,v)=>a+Math.max(0,v.budget-v.ausgegeben),0)*100)/100;
  const z=st.zaehler||{};
  return {wochen:V.length+1, kochen:kochen.length, mensa:mensa.length, lieblingsGericht:haeufigstes(kochen), lieblingsMensa:haeufigstes(mensa),
    gespart, sparWochen:mitEinkauf.length, fotos:z.fotos|0, preis:z.preis|0, seit:st.seit||''};
}
/* Kleinanzeigen: die App (iPhone/Android) übernimmt alle Links /s-… , versteht aber nur die Kurzform
   /s-<suchwort>/k0 (so baut Kleinanzeigen selbst um: klein, Leerzeichen und / werden -, Rest kodiert) */
function kaLink(q){
  const slug=String(q||'').trim().toLowerCase().replace(/[\s\/]+/g,'-').replace(/^-+|-+$/g,'').slice(0,120);
  if(!slug) return 'https://www.kleinanzeigen.de/s-buecher-zeitschriften/c76';
  return 'https://www.kleinanzeigen.de/s-'+encodeURIComponent(slug).replace(/[!'()*]/g,c=>'%'+c.charCodeAt(0).toString(16).toUpperCase())+'/k0';
}
/* Bücher & Second-Hand: Such-Links (Suchbegriff sicher in die Adresse) */
function buchLinks(q){
  const s=encodeURIComponent(String(q||'').trim().replace(/\s+/g,' ').slice(0,120)); if(!s) return [];
  return [['🏛️ Uni-Bibliothek (gratis leihen)','https://hbz-ulbms.primo.exlibrisgroup.com/discovery/search?vid=49HBZ_ULM:VU2&lang=de&query=any,contains,'+s],
    ['Kleinanzeigen',kaLink(q)],
    ['Vinted','https://www.vinted.de/catalog?search_text='+s],
    ['Medimops','https://www.medimops.de/produkte-C0/?fcIsSearch=1&searchparam='+s],
    ['ZVAB (Antiquariate)','https://www.zvab.com/servlet/SearchResults?kn='+s],
    ['Rebuy','https://www.rebuy.de/kaufen/suchen?q='+s]];
}

/* Mensa (Daten von OpenMensa) */
function gerichtName(s){
  return String(s||'').split(/\s{2,}/).map(p=>p.replace(/\([^)]*\)/g,'').replace(/\s+/g,' ').trim()).filter(Boolean)
    .reduce((a,p)=>!a?p:(/^(mit|und|an|auf|in|dazu)\b/i.test(p)?a+' '+p:a+' · '+p),'');
}
function warnungen(meal,profil){
  const notes=(meal.notes||[]).map(n=>String(n).toLowerCase());
  const text=(String(meal.name)+' '+notes.join(' ')).toLowerCase(), w=[];
  profil.magNicht.concat(profil.allergien).forEach(x=>{ if(x && text.includes(x.toLowerCase())) w.push(x); });
  const vegan=notes.includes('vegan'), veg=vegan||notes.includes('vegetarisch');
  if(profil.ernaehrung==='vegan' && !vegan) w.push('nicht als vegan markiert');
  if(profil.ernaehrung==='vegetarisch' && !veg) w.push('nicht als vegetarisch markiert');
  return w;
}
/* Kühlschrank: fehlende Zutaten auf die Einkaufsliste (ohne Doppelte), Code aus der QR-Adresse, Fotogröße */
function fehlendeHinzu(einkauf,fehlt){
  let n=0;
  (Array.isArray(fehlt)?fehlt:[]).forEach(x=>{ const t=String(x==null?'':x).trim().replace(/\s+/g,' ').slice(0,60);
    if(!t || einkauf.some(e=>!e.done && String(e.n).toLowerCase()===t.toLowerCase())) return;
    einkauf.push({n:t,p:null,s:'',done:false}); n++; });
  return n;
}
function codeAusAdresse(search){ const m=/[?&]k=([A-Za-z0-9_-]{4,64})(?:&|$)/.exec(search||''); return m?m[1]:''; }
function bildGroesse(w,h,max){ const f=Math.min(1,max/Math.max(w,h)); return [Math.max(1,Math.round(w*f)),Math.max(1,Math.round(h*f))]; }
/* Antwort vom KI-Server prüfen: nur bekannte Felder übernehmen, alles als Text */
function pruefeKuehl(d){
  if(!d||typeof d!=='object'||!Array.isArray(d.zutaten)||!Array.isArray(d.rezepte)) return null;
  const txt=(x,n)=>String(x==null?'':x).slice(0,n), arr=(a,n,m)=>(Array.isArray(a)?a:[]).slice(0,m).map(x=>txt(x,n));
  return {quak:txt(d.quak,300), unsicher:txt(d.unsicher,300), zeit:typeof d.zeit==='number'&&d.zeit>0?d.zeit:Date.now(),
    zutaten:d.zutaten.slice(0,40).map(z=>({name:txt(z&&z.name,60),menge:txt(z&&z.menge,40),haltbarkeit:['bald_verbrauchen','ok','lange'].includes(z&&z.haltbarkeit)?z.haltbarkeit:'ok'})).filter(z=>z.name),
    rezepte:d.rezepte.slice(0,5).map(r=>({titel:txt(r&&r.titel,80),minuten:Math.max(0,Math.min(300,parseInt(r&&r.minuten,10)||0)),nutzt:arr(r&&r.nutzt,60,20),fehlt:arr(r&&r.fehlt,60,20),schritte:arr(r&&r.schritte,400,15)})).filter(r=>r.titel)};
}
/* Preis-Check: Antwort prüfen, Links nur https */
function sichererLink(x){ try{ const u=new URL(String(x||'')); return u.protocol==='https:'&&u.href.length<=500?u.href:''; }catch(e){ return ''; } }
function pruefePreis(d){
  if(!d||typeof d!=='object'||typeof d.zusammenfassung!=='string') return null;
  const txt=(x,n)=>String(x==null?'':x).slice(0,n);
  return {urteil:['guenstig','ok','teuer','unklar'].includes(d.urteil)?d.urteil:'unklar', quak:txt(d.quak,300), zusammenfassung:txt(d.zusammenfassung,1500), tipp:txt(d.tipp,300),
    angebote:(Array.isArray(d.angebote)?d.angebote:[]).slice(0,4).map(a=>({wo:txt(a&&a.wo,80),preis:txt(a&&a.preis,30),zustand:['neu','gebraucht'].includes(a&&a.zustand)?a.zustand:'unklar',link:sichererLink(a&&a.link)})).filter(a=>a.wo),
    produkt:txt(d.produkt,200), meinPreis:txt(d.meinPreis,20), zeit:typeof d.zeit==='number'&&d.zeit>0?d.zeit:Date.now()};
}
/* Gespeicherte Daten prüfen (Gerätespeicher UND Sicherungsdatei): Kaputtes wird übersprungen, nie übernommen */
function standard(){ return {ziel:25, einkauf:[], plan:leererPlan(), woche:'', verlauf:[], begruesst:false, kicode:'', kuehl:null, preis:null, seit:'', zaehler:{fotos:0,preis:0},
  profil:{magNicht:[],mag:[],allergien:[],ernaehrung:'alles',laeden:[],mensa:1169,pruefungen:[],enteName:'',gespraechig:'normal'}}; }
function pruefeDaten(d){
  const s=standard();
  if(!d || typeof d!=='object' || Array.isArray(d)) return s;
  if(typeof d.ziel==='number'&&d.ziel>0&&isFinite(d.ziel)) s.ziel=d.ziel;
  if(Array.isArray(d.einkauf)) s.einkauf=d.einkauf.filter(x=>x&&typeof x.n==='string').map(x=>({n:x.n,p:typeof x.p==='number'&&isFinite(x.p)?x.p:null,s:typeof x.s==='string'?x.s:'',done:!!x.done}));
  if(d.plan && TAGE.every(t=>Array.isArray(d.plan[t]))) TAGE.forEach(t=>{ s.plan[t]=d.plan[t].filter(b=>b&&TYPEN[b.typ]&&typeof b.id==='string').map(b=>({id:b.id,typ:b.typ,text:typeof b.text==='string'?b.text:''})); });
  if(typeof d.woche==='string') s.woche=d.woche;
  if(Array.isArray(d.verlauf)) s.verlauf=d.verlauf.filter(v=>v&&typeof v.woche==='string');
  s.begruesst=!!d.begruesst;
  if(typeof d.kicode==='string'&&/^[A-Za-z0-9_-]{0,64}$/.test(d.kicode)) s.kicode=d.kicode;
  if(d.kuehl) s.kuehl=pruefeKuehl(d.kuehl);
  if(d.preis) s.preis=pruefePreis(d.preis);
  if(typeof d.seit==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d.seit)) s.seit=d.seit;
  if(d.zaehler&&typeof d.zaehler==='object') ['fotos','preis'].forEach(k=>{ const v=d.zaehler[k]; if(Number.isInteger(v)&&v>=0) s.zaehler[k]=v; });
  if(d.profil&&typeof d.profil==='object') Object.keys(s.profil).forEach(k=>{ const v=d.profil[k]; if(v!==undefined && v!==null && typeof v===typeof s.profil[k] && Array.isArray(v)===Array.isArray(s.profil[k])) s.profil[k]=v; });
  ['magNicht','mag','allergien','laeden'].forEach(k=>{ s.profil[k]=s.profil[k].filter(x=>typeof x==='string').map(x=>x.slice(0,40)); });
  s.profil.pruefungen=s.profil.pruefungen.filter(p=>p&&typeof p.n==='string'&&typeof p.d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(p.d)).map(p=>({n:p.n.slice(0,40),d:p.d}));
  if(!isFinite(s.profil.mensa)) s.profil.mensa=1169;
  return s;
}
function zuSpeichern(S){ return {ziel:S.ziel,einkauf:S.einkauf,plan:S.plan,woche:S.woche,verlauf:S.verlauf,begruesst:S.begruesst,kicode:S.kicode,kuehl:S.kuehl,preis:S.preis,seit:S.seit,zaehler:S.zaehler,profil:S.profil}; }
/* Sicherungsdatei: {app:'studi-ente', version:1, datum, daten:{…}} */
function sicherungMachen(S,jetzt){ return JSON.stringify({app:'studi-ente',version:1,datum:iso(jetzt||new Date()),daten:zuSpeichern(S)}); }
function sicherungLesen(text){
  if(typeof text!=='string'||text.length>2000000) return {fehler:'Die Datei ist zu groß. Ist das wirklich eine Enten-Sicherung?'};
  let d; try{ d=JSON.parse(text); }catch(e){ return {fehler:'Die Datei kann ich nicht lesen. Ist das wirklich eine Enten-Sicherung?'}; }
  if(!d||d.app!=='studi-ente'||!d.daten||typeof d.daten!=='object') return {fehler:'Das ist keine Enten-Sicherung. Quak?'};
  return {daten:pruefeDaten(d.daten), datum:typeof d.datum==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d.datum)?d.datum:''};
}
if(typeof module!=='undefined') module.exports={standard,pruefeDaten,zuSpeichern,sicherungMachen,sicherungLesen,TAGE,TYPEN,neuerBlock,leererPlan,findeBlock,einfuegen,verschieben,entfernen,zaehle,
  fuegeHinzu,tageBis,naechstePruefung,iso,montagVon,tagHeute,datumFuerTag,tagVonDatum,parsePreis,ausgegeben,neueWoche,gerichtName,warnungen,
  fehlendeHinzu,codeAusAdresse,bildGroesse,pruefeKuehl,sichererLink,pruefePreis,planTexte,haeufigstes,rueckblick,buchLinks};

<script>

const S=lade();
const U={screen:'start', reiter:'essen', mensa:null, datum:null, kuehl:{status:'leer'}, preis:{status:'leer'}, buch:''};   // nur Bildschirm-Zustand, wird nicht gespeichert
neueWoche(S,new Date());
if(!S.seit) S.seit=iso(new Date());   // erster Tag mit der Ente (für den Rückblick)

/* ---------- Ente ---------- */

/* ---------- Hilfen ---------- */
const NAV=[['start','🏠','Start'],['woche','📅','Woche'],['mensa','🍽️','Mensa'],['einkauf','🛒','Einkauf'],['kuehl','🧊','Kühlschrank'],['preis','🏷️','Preis'],['profil','🙂','Profil']];
const $=s=>document.querySelector(s);
function eur(x){return x.toFixed(2).replace('.',',')+'\u00a0€'}   // geschütztes Leerzeichen: € rutscht nie allein in die nächste Zeile
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function mensaName(id){ const m=MENSEN.find(x=>x[0]===id); return m?m[1]:'Mensa'; }
function mensaIdVon(text){ const t=String(text||'').toLowerCase(); const m=MENSEN.find(x=>t.includes(x[1].toLowerCase())||t.includes(x[1].toLowerCase().replace(/^(mensa|bistro) /,''))); return m?m[0]:S.profil.mensa; }
function datumKurz(s){ const [y,m,d]=s.split('-'); return tagVonDatum(s)+' '+d+'.'+m+'.'; }
function istIosSafari(){ const ua=navigator.userAgent||''; const ios=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1); return ios && !navigator.standalone && !matchMedia('(display-mode: standalone)').matches; }
function sprich(normal,wenig,viel){ const g=S.profil.gespraechig; return g==='wenig'?wenig:g==='viel'?viel:normal; }
function gruss(){ return S.profil.enteName?`<b>Quak, hier ist ${esc(S.profil.enteName)}!</b>`:'<b>Quak!</b>'; }

/* ---------- Mensa-Daten holen (mit Zwischenspeicher, damit nicht ständig neu geladen wird) ---------- */
const MC={}, MD={};
const API='https://openmensa.org/api/v2/canteens/';
function mensaDaten(id,datum){
  const k=id+'|'+datum; if(MC[k]) return MC[k];
  MC[k]={status:'laden',meals:[]};
  fetch(API+id+'/days/'+datum+'/meals').then(r=>{ if(r.status===404) return []; if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(m=>{ MC[k]={status:m.length?'ok':'leer',meals:m}; })
    .catch(()=>{ MC[k]={status:'fehler',meals:[]}; })
    .then(()=>nachLaden(k));
  return MC[k];
}
function mensaTage(id){
  if(MD[id]) return MD[id];
  MD[id]={status:'laden',tage:[]};
  const heute=iso(new Date());
  fetch(API+id+'/days').then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(d=>{ MD[id]={status:'ok',tage:d.filter(x=>!x.closed && x.date>=heute).map(x=>x.date).slice(0,6)}; })
    .catch(()=>{ MD[id]={status:'fehler',tage:[]}; })
    .then(()=>{ if(U.screen==='mensa') render(); });
  return MD[id];
}
function mensaKurz(k){
  const c=MC[k]; if(!c||c.status==='laden') return 'lädt …';
  if(c.status==='fehler') return 'keine Verbindung'; if(c.status==='leer') return 'kein Speiseplan';
  const haupt=c.meals.filter(m=>m.category!=='Beilagen');
  const pr=haupt.map(m=>m.prices&&m.prices.students).filter(p=>typeof p==='number');
  return haupt.length+(haupt.length===1?' Gericht':' Gerichte')+(pr.length?' ab '+eur(Math.min(...pr)):'')+' ›';
}
function nachLaden(k){
  if(U.screen==='mensa'){ render(); return; }
  document.querySelectorAll(`[data-mi="${k}"]`).forEach(e=>e.textContent=mensaKurz(k));   // nur den kleinen Text tauschen, Eingaben bleiben
}
function mensaInfo(text,datum){
  const id=mensaIdVon(text), k=id+'|'+datum; mensaDaten(id,datum);
  return `<button class="minfo" data-mgo="${id}|${datum}"><span data-mi="${k}">${mensaKurz(k)}</span></button>`;
}

/* ---------- KI-Server (Kühlschrank) ---------- */
const KI_URL=(location.hostname==='localhost'&&localStorage.getItem('studi-ente-ki-url'))||'https://studi-ente-ki.quak-ente.workers.dev';
// Meldet Arthurs Wächter, wenn keine/komische Antwort kam (z. B. Cloudflare hat den Server wegen Rechenzeit abgebrochen)
function meldeFehler(wo,was){ if(!S.kicode||!navigator.onLine) return;
  try{ fetch(KI_URL+'/meldung',{method:'POST',headers:{'Content-Type':'application/json'},keepalive:true,body:JSON.stringify({code:S.kicode,wo,was})}).catch(()=>{}); }catch(e){} }
function verkleinere(datei,max){ return new Promise((ok,nein)=>{ const url=URL.createObjectURL(datei), img=new Image();
  img.onload=()=>{ const [w,h]=bildGroesse(img.naturalWidth,img.naturalHeight,max), c=document.createElement('canvas'); c.width=w; c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h); URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg',0.8)); };
  img.onerror=()=>{ URL.revokeObjectURL(url); nein(new Error('bild')); }; img.src=url; }); }
async function kuehlFoto(datei){
  if(!datei) return;
  const P=S.profil; U.kuehl={status:'laden',vorschau:''}; render();
  try{
    const bild=await verkleinere(datei,1280); U.kuehl.vorschau=bild; if(U.screen==='kuehl') render();
    const ctrl=new AbortController(), uhr=setTimeout(()=>ctrl.abort(),90000);
    const r=await fetch(KI_URL+'/kuehlschrank',{method:'POST',headers:{'Content-Type':'application/json'},signal:ctrl.signal,
      body:JSON.stringify({code:S.kicode,art:'image/jpeg',bild:bild.split(',')[1],profil:{magNicht:P.magNicht,mag:P.mag,allergien:P.allergien,ernaehrung:P.ernaehrung}})});
    clearTimeout(uhr);
    const d=await r.json().catch(()=>({}));
    if(r.status===401){ S.kicode=''; U.kuehl={status:'fehler',fehler:'Der Zugangscode stimmt nicht. Gib ihn bitte nochmal ein.'}; }
    else if(!r.ok){ U.kuehl={status:'fehler',fehler:String(d.fehler||'Da ist was schiefgelaufen. Bitte nochmal probieren.').slice(0,200)}; if(!d.fehler) meldeFehler('kuehlschrank','Status '+r.status+' ohne Text'); }
    else { const e=pruefeKuehl(d);
      if(e){ e.zeit=Date.now(); S.kuehl=e; S.zaehler.fotos++; U.kuehl={status:'ok',rest:typeof d.rest==='number'?d.rest:null,erledigt:{}}; }
      else { U.kuehl={status:'fehler',fehler:'Die Antwort war komisch. Bitte nochmal probieren.'}; meldeFehler('kuehlschrank','Antwort komisch'); } }
  }catch(e){ if(e.message!=='bild') meldeFehler('kuehlschrank',e.name==='AbortError'?'zu lange gewartet (90 s)':'keine Antwort vom Server');
    U.kuehl={status:'fehler',fehler:e.message==='bild'?'Das Foto konnte ich nicht öffnen. Probier ein anderes.':e.name==='AbortError'?'Das hat zu lange gedauert. Bitte nochmal probieren.':'Keine Verbindung. Bist du online?'}; }
  if(U.screen==='kuehl') render(); else speichere();
}

let letzteSuche={produkt:'',meinPreis:'',link:''};   // bleibt nach einem Fehler in den Feldern stehen
async function preisCheck(produkt,meinPreis,link){
  letzteSuche={produkt,meinPreis,link}; U.preis={status:'laden'}; render();

    const ctrl=new AbortController(), uhr=setTimeout(()=>ctrl.abort(),150000);

    clearTimeout(uhr);
    const d=await r.json().catch(()=>({}));
    if(r.status===401){ S.kicode=''; U.preis={status:'fehler',fehler:'Der Zugangscode stimmt nicht. Gib ihn bitte nochmal ein.'}; }
    else if(!r.ok){ U.preis={status:'fehler',fehler:String(d.fehler||'Da ist was schiefgelaufen. Bitte nochmal probieren.').slice(0,200)}; if(!d.fehler) meldeFehler('preischeck','Status '+r.status+' ohne Text'); }
    else { const e=pruefePreis(Object.assign({},d,{produkt:produkt||link,meinPreis,zeit:Date.now()}));
      if(e){ S.preis=e; S.zaehler.preis++; U.preis={status:'ok',rest:typeof d.rest==='number'?d.rest:null}; } else { U.preis={status:'fehler',fehler:'Die Antwort war komisch. Bitte nochmal probieren.'}; meldeFehler('preischeck','Antwort komisch'); } }
  }catch(e){ meldeFehler('preischeck',e.name==='AbortError'?'zu lange gewartet (150 s)':'keine Antwort vom Server');
    U.preis={status:'fehler',fehler:e.name==='AbortError'?'Das hat zu lange gedauert. Bitte nochmal probieren.':'Keine Verbindung. Bist du online?'}; }
  if(U.screen==='preis') render(); else speichere();
}

  <div class="card"><h2>${rest>=0?`Diese Woche noch übrig: ${eur(rest)}`:`Budget um ${eur(-rest)} überzogen`}</h2><div class="zaehler"><i style="width:${proz}%"></i></div>
   <p class="hint">${eur(ausg)} von ${eur(S.ziel)} ausgegeben (abgehakte Einkäufe). ${rest>=0?'Gut gemacht!':'Nicht schlimm, nächste Woche wird’s wieder.'}</p></div>
  <div class="grid">
    <div class="card"><h2>📅 Wochenplan</h2><p class="hint">Einkaufen, Kochen, Mensa und Sonstiges per Finger in die Woche ziehen.</p><button class="btn" data-go="woche">Zur Woche</button></div>
    <div class="card"><h2>🍽️ Mensa</h2><p class="hint">Was gibt’s heute in der ${esc(mensaName(S.profil.mensa))}?</p><button class="btn soft" data-go="mensa">Speiseplan</button></div>
    <div class="card"><h2>🧊 Kühlschrank</h2><p class="hint">Foto machen, Rezepte aus deinen Resten bekommen.</p><button class="btn soft" data-go="kuehl">Reinschauen</button></div>
    <div class="card"><h2>🛒 Einkauf</h2><p class="hint">${S.einkauf.filter(x=>!x.done).length} Sachen auf der Liste.</p><button class="btn soft" data-go="einkauf">Zur Liste</button></div>
    <div class="card"><h2>🏆 Dein Kochjahr</h2><p class="hint">Was du mit der Ente schon alles geschafft hast.</p><button class="btn soft" data-go="rueckblick">Rückblick</button></div>
    <div class="card"><h2>📚 Bücher</h2><p class="hint">Fachbuch gesucht? Erst leihen, dann gebraucht.</p><button class="btn soft" data-go="preis">Buch suchen</button></div>
  </div>
  ${istIosSafari()?'<div class="card"><h2>📲 Tipp: Leg mich auf deinen Home-Bildschirm</h2><p class="hint" style="margin:0">Unten auf <b>Teilen</b> (□↑) tippen, dann <b>„Zum Home-Bildschirm“</b>. Benutz mich danach nur noch von dort: Safari und Home-Bildschirm merken sich getrennte Sachen.</p></div>':''}
  ${speicherFehler?'<p class="chip warn">Speichern klappt gerade nicht (privater Modus?)</p>':''}`;
}

function seiteWoche(){
  const z=zaehle(S.plan), h=new Date(), heute=tagHeute(h);
  return `<h1>Wochenplan</h1><p class="sub">Zieh einen Baustein am Griff ⋮⋮ auf einen Tag. Zurück in die Leiste ziehen = löschen.</p>
  <div class="palette" id="pal"><span class="t">Bausteine:</span>${Object.keys(TYPEN).map(t=>`<div class="block pal ${t}" data-typ="${t}"><div class="kopf"><span>${TYPEN[t].icon}</span>${TYPEN[t].label}</div></div>`).join('')}</div>
  <div class="woche">${TAGE.map(t=>{const d=datumFuerTag(t,h);
    return `<div class="tag" ${t===heute?'style="outline:3px solid var(--gelb)"':''}><h3>${t} ${d.slice(8)}.${d.slice(5,7)}.</h3><div class="dayzone" data-tag="${t}">${S.plan[t].length?S.plan[t].map(b=>blockHtml(b,d)).join(''):'<div class="leer">hierher ziehen</div>'}</div></div>`}).join('')}</div>
  <div class="card" style="margin-top:16px"><b>Diese Woche:</b> ${z.mensa}× Mensa · ${z.kochen}× Kochen · ${z.einkaufen}× Einkaufen · ${z.sonstiges}× Sonstiges</div>`;
}
function blockHtml(b,datum){
  const T=TYPEN[b.typ];
  const feld = b.typ==='mensa'
    ? `<select data-ms="${b.id}" aria-label="Mensa wählen">${MENSEN.map(([id,n])=>`<option value="${id}" ${id===mensaIdVon(b.text)?'selected':''}>${esc(n)}</option>`).join('')}</select>${mensaInfo(b.text,datum)}`
    : `<textarea rows="3" placeholder="${T.platz}" data-t="${b.id}">${esc(b.text)}</textarea>`;
  return `<div class="block ${b.typ}" data-id="${b.id}"><div class="kopf"><span class="grip" title="Festhalten und ziehen">⋮⋮</span><span>${T.icon}</span>${T.label}<button class="x" data-x="${b.id}" aria-label="Löschen">✕</button></div>${feld}</div>`;
}

function seiteMensa(){
  const id=U.mensa||S.profil.mensa, P=S.profil, td=mensaTage(id);
  let datum=U.datum && td.tage.includes(U.datum) ? U.datum : td.tage[0];
  let inhalt='';
  if(td.status==='laden') inhalt='<p class="hint">Die Ente fragt nach dem Speiseplan …</p>';
  else if(td.status==='fehler') inhalt='<div class="card">Keine Verbindung zum Speiseplan. <button class="btn soft" id="nochmal">Nochmal</button></div>';
  else if(!datum) inhalt='<div class="card">Für die nächsten Tage gibt es noch keinen Speiseplan.</div>';
  else {
    const c=mensaDaten(id,datum);
    const tage=`<div class="tage">${td.tage.map(d=>`<button class="${d===datum?'on':''}" data-tg="${d}">${datumKurz(d)}</button>`).join('')}</div>`;
    let liste='';
    if(c.status==='laden') liste='<p class="hint">lädt …</p>';
    else if(c.status==='fehler') liste='<div class="card">Keine Verbindung. <button class="btn soft" id="nochmal">Nochmal</button></div>';
    else if(c.status==='leer') liste='<div class="card">Für diesen Tag gibt es keinen Speiseplan.</div>';
    else {
      const haupt=c.meals.filter(m=>m.category!=='Beilagen'), beil=c.meals.filter(m=>m.category==='Beilagen');
      const karte=m=>{ const w=warnungen(m,P), n=(m.notes||[]).map(x=>String(x).toLowerCase()), p=m.prices&&m.prices.students;
        const mag=P.mag.some(x=>m.name.toLowerCase().includes(x.toLowerCase()));
        return `<div class="card"><div class="gericht"><div><h2 style="margin:0 0 6px">${mag?'💛 ':''}${esc(gerichtName(m.name))}</h2>
          ${n.includes('vegan')?'<span class="chip ok">vegan</span> ':n.includes('vegetarisch')?'<span class="chip ok">vegetarisch</span> ':''}
          ${w.map(x=>`<span class="chip warn">⚠️ ${esc(x)}</span>`).join(' ')}</div><div class="preis">${typeof p==='number'?eur(p):''}</div></div></div>`; };
      liste=haupt.map(karte).join('')+(beil.length?`<div class="card"><h2>Beilagen</h2>${beil.map(m=>`<div class="zeile"><span class="n">${esc(gerichtName(m.name))}</span><b>${m.prices&&typeof m.prices.students==='number'?eur(m.prices.students):''}</b></div>`).join('')}</div>`:'');
    }
    const woche=TAGE.map(t=>datumFuerTag(t,new Date()));
    inhalt=tage+liste+(woche.includes(datum)?`<p><button class="btn" id="inplan">In den Wochenplan (${tagVonDatum(datum)})</button></p>`:'');
  }
  return `<h1>Mensa</h1><p class="sub">Echte Speisepläne für Münster, Preise für Studierende.</p>
  <div class="mensen mzeile">${MENSEN.map(([m,n])=>`<button class="klein ${m===id?'on':''}" data-mz="${m}">${esc(n)}</button>`).join('')}</div>
  ${inhalt}
  <p class="hint">⚠️ = passt nicht zu deinem Profil, 💛 = magst du. Daten von OpenMensa (Freiwillige). Allergien bitte immer an der Theke nachfragen, die Ente kann sich irren.</p>`;
}

function seiteEinkauf(){
  const ausg=ausgegeben(S.einkauf), rest=S.ziel-ausg, L=S.profil.laeden;
  const offen=S.einkauf.map((x,i)=>[x,i]).filter(([x])=>!x.done), fertig=S.einkauf.map((x,i)=>[x,i]).filter(([x])=>x.done);
  const zeile=([x,i])=>`<div class="zeile"><input type="checkbox" data-chk="${i}" ${x.done?'checked':''} style="width:26px;height:26px;flex:none"><span class="n" style="${x.done?'text-decoration:line-through;opacity:.5':''}">${esc(x.n)}</span>${x.s?`<span class="chip">${esc(x.s)}</span>`:''}<b>${typeof x.p==='number'?eur(x.p):''}</b><button class="btn soft" data-edel="${i}" style="padding:5px 11px">✕</button></div>`;
  return `<h1>Einkaufsliste</h1><p class="sub">Abhaken, wenn gekauft. Mit Preis zählt es fürs Wochenbudget.</p>
  <div class="card">${offen.length?offen.map(zeile).join(''):'<p class="hint">Liste ist leer. 🎉</p>'}
   <div class="zeile ezeile" style="flex-wrap:wrap"><input type="text" id="en" placeholder="Neu: z. B. Nudeln" style="flex:2 1 160px" enterkeyhint="done"><input type="text" id="ep" inputmode="decimal" placeholder="Preis (frei)" style="flex:1 1 90px;width:90px">
   ${L.length?`<select id="el"><option value="">Laden?</option>${L.map(l=>`<option>${esc(l)}</option>`).join('')}</select>`:''}<button class="btn soft" id="ea">+</button></div>
   <p class="hint" id="efehl" style="margin:4px 0 0"></p></div>
  ${fertig.length?`<div class="card"><h2>Schon gekauft</h2>${fertig.map(zeile).join('')}</div>`:''}
  <div class="card"><h2>${rest>=0?'Noch übrig: '+eur(rest):'Überzogen: '+eur(-rest)}</h2><div class="zaehler"><i style="width:${Math.min(100,ausg/S.ziel*100)}%"></i></div><p class="hint">Wochenbudget ${eur(S.ziel)} (ändern im Profil). Am Montag fängt die Woche neu an.</p></div>`;
}

/* Home-Bildschirm-App auf dem iPhone hat eigenen Speicher: Code aus Safari kommt dort nicht an */
const alsIphoneApp=()=>typeof navigator!=='undefined'&&navigator.standalone===true;
function codeEingabe(titel,text){
  const hilfe=alsIphoneApp()
    ? `<div class="card"><h2>So kommt der Code ganz leicht rein</h2><p class="hint" style="margin:0 0 6px">Dieses Enten-Symbol kennt deine Karte noch nicht. Einmal neu anlegen, dann klappt's:</p>
      <ol style="margin:0;padding-left:22px;line-height:1.6"><li>Ente auf dem Home-Bildschirm lange drücken → <b>App entfernen</b>.</li><li>Den QR-Code auf deiner Karte mit der <b>Kamera</b> scannen.</li><li>In Safari unten auf <b>Teilen</b> (□↑) → <b>Zum Home-Bildschirm</b>.</li></ol>
      <p class="hint" style="margin:6px 0 0">Keine Sorge: Deinen Plan vorher im Profil unter 🦆 Ente sichern, dann holst du ihn danach zurück.</p></div>`
    : `<p class="hint" style="margin:0 0 10px">Am leichtesten: Scanne einfach nochmal den QR-Code auf deiner Karte. 🦆</p>`;
  return `<h1>${titel}</h1><div class="ente-row">${ente('normal',120)}<div class="bubble">${gruss()} ${esc(text)}</div></div>${hilfe}
    <div class="card"><div class="zeile"><input type="text" id="kcode" placeholder="Zugangscode" autocomplete="off" autocapitalize="off" spellcheck="false" style="flex:1" enterkeyhint="done"><button class="btn" id="kok">OK</button></div><p class="hint" id="kfehl" style="margin:4px 0 0"></p></div>`;
}
function seiteKuehl(){
  if(!KI_URL) return seiteBald('Kühlschrank','Bald machst du hier ein Foto von deinem Kühlschrank, und ich schlage dir Rezepte aus deinen Resten vor.');
  const K=U.kuehl, E=S.kuehl, P=S.profil;
  if(!S.kicode) return codeEingabe('Kühlschrank',K.status==='fehler'?K.fehler:'Bevor ich in deinen Kühlschrank schauen darf, brauche ich einmal den Zugangscode von deiner Geburtstagskarte.');
  const knoepfe=`<div class="card knoepfe"><label class="btn">📸 Foto machen<input type="file" accept="image/*" capture="environment" class="versteckt" data-foto></label>
    <label class="btn soft">🖼️ Aus Fotos wählen<input type="file" accept="image/*" class="versteckt" data-foto></label>
    <p class="hint" style="margin:10px 0 0">Tür auf, alles gut sichtbar, nicht zu dunkel. Klappt auch mit dem Vorratsschrank.</p></div>`;
  let oben='';
  if(K.status==='laden') oben=`<div class="ente-row">${ente('normal',120)}<div class="bubble"><b>Ich schaue mal nach …</b> 🔍 Das dauert ein paar Sekunden.</div></div>${K.vorschau?`<img class="kvorschau" src="${K.vorschau}" alt="Dein Foto">`:''}`;
  else if(K.status==='fehler') oben=`<div class="ente-row">${ente('schlaf',110)}<div class="bubble"><b>Oh nein!</b> ${esc(K.fehler)}</div></div>`;
  let erg='';
  if(E && K.status!=='laden'){
    const icon={bald_verbrauchen:'⏰ ',ok:'',lange:'📦 '}, kl={bald_verbrauchen:'warn',ok:'',lange:'ok'};
    const reihe=['bald_verbrauchen','ok','lange'], zut=E.zutaten.slice().sort((a,b)=>reihe.indexOf(a.haltbarkeit)-reihe.indexOf(b.haltbarkeit));
    const erledigt=K.erledigt||{};
    erg=`${K.status==='ok'?`<div class="ente-row">${ente('froh',120)}<div class="bubble">${gruss()} ${esc(E.quak)}</div></div>`:`<p class="hint">Dein letztes Foto vom ${new Date(E.zeit).toLocaleDateString('de-DE')}:</p>`}
    <div class="card"><h2>Das hab ich gefunden</h2><div class="chips">${zut.map(z=>`<span class="chip ${kl[z.haltbarkeit]}">${icon[z.haltbarkeit]}${esc(z.name)}${z.menge?` <small>(${esc(z.menge)})</small>`:''}</span>`).join('')||'<span class="hint">Nichts erkannt.</span>'}</div>
      <p class="hint" style="margin:6px 0 0">⏰ = bald verbrauchen · 📦 = hält lange${E.unsicher?'<br>Nicht sicher: '+esc(E.unsicher):''}</p></div>
    ${E.rezepte.map((r,i)=>{ const w=warnungen({name:[r.titel].concat(r.nutzt,r.fehlt).join(' '),notes:['vegan']},Object.assign({},P,{ernaehrung:'alles'}));
      return `<div class="card krezept"><h2 style="margin:0 0 6px">${esc(r.titel)}</h2><span class="chip">⏱️ ${r.minuten} Min.</span> ${w.map(x=>`<span class="chip warn">⚠️ ${esc(x)}</span>`).join(' ')}
      <p style="margin:10px 0 4px"><b>Hast du:</b> ${esc(r.nutzt.join(', '))||'–'}</p><p style="margin:0 0 8px"><b>Fehlt noch:</b> ${r.fehlt.length?esc(r.fehlt.join(', ')):'nichts 🎉'}</p>
      <details><summary>So geht's</summary><ol>${r.schritte.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></details>
      <div class="knoepfe" style="margin-top:10px">${r.fehlt.length?`<button class="btn soft" data-rfehlt="${i}" ${erledigt['f'+i]?'disabled':''}>${erledigt['f'+i]?'✓ '+erledigt['f'+i]:'🛒 Fehlendes auf die Liste'}</button>`:''}
       <button class="btn soft" data-rplan="${i}" ${erledigt['p'+i]?'disabled':''}>${erledigt['p'+i]?'✓ Im Wochenplan':'📅 Heute kochen'}</button></div></div>`; }).join('')}
    ${K.status==='ok'&&K.rest!=null?`<p class="hint">Diese Woche gehen noch ${K.rest} Fotos.</p>`:''}`;
  }
  return `<h1>Kühlschrank</h1><p class="sub">Foto machen: Die Ente schaut, was bald weg muss, und schlägt dir Rezepte vor.</p>
  ${K.status==='laden'?'':knoepfe}${oben}${erg}
  <p class="hint">Die Ente achtet auf dein Profil (mag nicht, Allergien, ${esc(P.ernaehrung)}). Sie kann sich irren: Bei Allergien bitte immer selbst auf die Packung schauen.</p>`;
}
function seitePreis(){

  const form=`<div class="card"><h2>Was willst du kaufen?</h2>
    <div class="pzeile"><input type="text" id="pprod" value="${U.preis.status==='fehler'?esc(letzteSuche.produkt):''}" placeholder="z. B. Statistik-Buch von Bortz" maxlength="200" enterkeyhint="search"></div>
    <div class="pzeile"><input type="text" id="ppreis" value="${U.preis.status==='fehler'?esc(letzteSuche.meinPreis):''}" inputmode="decimal" placeholder="Dein Preis (frei)" maxlength="20" style="max-width:170px"><input type="url" id="plink" value="${U.preis.status==='fehler'?esc(letzteSuche.link):''}" placeholder="Link (frei)" maxlength="400" autocapitalize="off"></div>
    <div class="knoepfe" style="margin-top:6px"><button class="btn" id="pgo">🔍 Preis checken</button></div><p class="hint" id="pfehl" style="margin:6px 0 0"></p></div>`;
  let oben='';
  if(K.status==='laden') oben=`<div class="ente-row">${ente('normal',120)}<div class="bubble"><b>Ich suche im Internet …</b> 🔍 Das kann bis zu einer Minute dauern.</div></div>`;
  else if(K.status==='fehler') oben=`<div class="ente-row">${ente('schlaf',110)}<div class="bubble"><b>Oh nein!</b> ${esc(K.fehler)}</div></div>`;
  let erg='';
  if(E && K.status!=='laden'){
    const U2={guenstig:['ok','👍 Guter Preis!'],ok:['','🙂 Normaler Preis'],teuer:['warn','😬 Geht günstiger'],unklar:['','🤔 Schwer zu sagen']}[E.urteil];
    erg=`${K.status==='ok'?`<div class="ente-row">${ente('froh',110)}<div class="bubble">${gruss()} ${esc(E.quak)}</div></div>`:`<p class="hint">Dein letzter Preis-Check vom ${new Date(E.zeit).toLocaleDateString('de-DE')}:</p>`}
    <div class="card"><h2 style="margin:0 0 6px">${esc(E.produkt)}${E.meinPreis?` <small>für ${esc(E.meinPreis)}</small>`:''}</h2><span class="chip ${U2[0]}">${U2[1]}</span>
      <p>${esc(E.zusammenfassung)}</p>
      ${E.angebote.map(a=>`<div class="zeile"><span class="n">${a.link?`<a href="${esc(a.link)}" target="_blank" rel="noopener noreferrer">${esc(a.wo)}</a>`:esc(a.wo)}</span>${a.zustand!=='unklar'?`<span class="chip ${a.zustand==='gebraucht'?'ok':''}">${a.zustand}</span>`:''}<b>${esc(a.preis)}</b></div>`).join('')}
      ${E.tipp?`<p class="hint">💡 ${esc(E.tipp)}</p>`:''}
      <div class="knoepfe" style="margin-top:8px"><button class="btn soft" id="pliste" ${U.preis.aufListe?'disabled':''}>${U.preis.aufListe?'✓ Auf der Einkaufsliste':'🛒 Auf die Einkaufsliste'}</button></div></div>
    ${K.status==='ok'&&K.rest!=null?`<p class="hint">Diese Woche gehen noch ${K.rest} Preis-Checks.</p>`:''}`;
  }
  return `<h1>Preis-Check</h1><p class="sub">Die Ente sucht im Internet, ob es neu oder gebraucht günstiger geht.</p>

function buchKarte(){
  const L=buchLinks(U.buch||'');
  return `<div class="card" id="buecher"><h2>📚 Bücher &amp; Second-Hand</h2>
    <div class="pzeile"><input type="text" id="bq" value="${esc(U.buch||'')}" placeholder="Titel, Autor oder ISBN" maxlength="120" style="flex:1;width:100%" enterkeyhint="search"></div>
    <div class="knoepfe" id="blinks" style="margin-top:6px">${L.length?L.map(([n,u])=>`<a class="btn soft" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${n}</a>`).join(''):'<p class="hint" style="margin:0">Tipp oben einen Buchtitel ein, dann suche ich überall gleichzeitig.</p>'}</div>
    <p class="hint" style="margin:8px 0 0">Tipp der Ente: Erst in der Uni-Bibliothek schauen. Leihen ist gratis! 🦆</p></div>`;

function seiteRueckblick(){
  const R=rueckblick(S), seit=R.seit?new Date(R.seit+'T12:00').toLocaleDateString('de-DE',{day:'numeric',month:'long',year:'numeric'}):'heute';
  const leer=!R.kochen&&!R.mensa&&!R.fotos&&!R.preis&&!R.sparWochen;
  const zahl=(n,txt,ic)=>`<div class="card rb"><div class="rbz">${ic} ${n}</div><div class="hint" style="margin:0">${txt}</div></div>`;
  const satz=leer?'Wir fangen gerade erst an! Plan was in der Woche, koch was Leckeres, und ich zähle hier alles mit. 💛'
    : R.kochen>=R.mensa?`${R.kochen}-mal selbst gekocht! Ich bin so stolz auf dich. 🍳`:`${R.mensa}-mal Mensa: Du kennst dich aus! 🍽️`;
  return `<h1>Dein Kochjahr 🏆</h1><p class="sub">Mit der Ente seit dem ${seit} · Woche ${R.wochen}</p>
  <div class="ente-row">${ente('froh',130)}<div class="bubble">${gruss()} ${satz}</div></div>
  <div class="grid zwei">
    ${zahl(R.kochen,'mal gekocht (laut Wochenplan)','🍳')}
    ${zahl(R.mensa,'mal Mensa (laut Wochenplan)','🍽️')}
    ${zahl(R.fotos,'Kühlschrank-Fotos','📸')}
    ${zahl(R.preis,'Preis-Checks','🏷️')}
  </div>
  ${R.lieblingsGericht?`<div class="card"><h2>💛 Lieblingsgericht: ${esc(R.lieblingsGericht.n)}</h2><p class="hint" style="margin:0">${R.lieblingsGericht.x}-mal im Plan</p></div>`:''}
  ${R.lieblingsMensa?`<div class="card"><h2>🍽️ Lieblingsmensa: ${esc(R.lieblingsMensa.n)}</h2><p class="hint" style="margin:0">${R.lieblingsMensa.x}-mal im Plan</p></div>`:''}
  ${R.sparWochen?`<div class="card"><h2>💶 Unter dem Budget geblieben: ${eur(R.gespart)}</h2><p class="hint" style="margin:0">aus ${R.sparWochen} ${R.sparWochen===1?'Woche':'Wochen'} mit Einkäufen</p></div>`:''}

function seiteBald(titel,text){

    <div class="card"><h2>Allergien / vertrage ich nicht</h2>${liste('allergien','','z. B. Nüsse')}</div>
    <div class="card"><h2>Ich esse</h2>${wahl('ern',[['alles','Alles'],['vegetarisch','Vegetarisch'],['vegan','Vegan']],P.ernaehrung)}</div>
    <p class="hint">In der Mensa markiert die Ente, was nicht passt (⚠️) und was du magst (💛).</p>`;
  if(r==='geld') inhalt=`<div class="card"><h2>Wochenbudget für Einkäufe</h2><div class="zeile"><input type="text" inputmode="decimal" id="budget" value="${String(S.ziel).replace('.',',')}" style="width:120px"> <span>€ pro Woche</span></div>
    <p class="hint">Danach richten sich Einkaufsliste und Spar-Zähler.</p></div>
    <div class="card"><h2>Meine Läden</h2>${liste('laeden','','z. B. Aldi')}</div>`;
  if(r==='mensa') inhalt=`<div class="card"><h2>Meine Lieblingsmensa</h2><div class="mensen">${MENSEN.map(([m,n])=>`<button class="${m===P.mensa?'on':''}" data-mensa="${m}">🍽️ ${esc(n)}</button>`).join('')}</div>
    <p class="hint">Neue Mensa-Bausteine im Wochenplan bekommen diese Mensa automatisch.</p></div>`;
  if(r==='pruef') inhalt=`<div class="card"><h2>Meine Prüfungen</h2>${P.pruefungen.length?P.pruefungen.map((p,i)=>{const t=tageBis(p.d,heute);
      return `<div class="zeile"><span class="n">${esc(p.n)}</span><span class="chip ${t>=0&&t<=7?'warn':''}">${isNaN(t)?'Datum fehlt':t<0?'vorbei 🎉':t===0?'heute!':'in '+t+(t===1?' Tag':' Tagen')}</span><button class="btn soft" data-prm="${i}" style="padding:5px 12px">✕</button></div>`}).join(''):'<p class="hint">Noch keine Prüfung eingetragen.</p>'}
    <div class="pzeile"><input type="text" id="pname" placeholder="Fach, z. B. Statistik"><input type="date" id="pdatum" aria-label="Datum"><button class="btn soft" id="padd">+</button></div></div>
    <p class="hint">Die nächste Prüfung zählt die Ente auf der Startseite herunter.</p>`;
  if(r==='ente') inhalt=`<div class="card"><h2>Name der Ente</h2><div class="zeile"><input type="text" id="ename" value="${esc(P.enteName)}" placeholder="Darf sie einen Namen haben?" style="flex:1" enterkeyhint="done"></div></div>
    <div class="card"><h2>Wie viel soll sie reden?</h2>${wahl('gs',[['wenig','Wenig'],['normal','Normal'],['viel','Viel']],P.gespraechig)}
    <div class="ente-row" style="margin:14px 0 0">${ente(P.gespraechig==='wenig'?'normal':'froh',80)}<div class="bubble">${sprich('Quak! Heute ist Mensa-Tag. Lass es dir schmecken!','Quak. Heute Mensa.','Quak quak! Heute ist Mensa-Tag, und ich hab schon geschaut: Es gibt was Leckeres. Ich glaub an dich! 💛')}</div></div></div>
    <div class="card" id="sicherung"><h2>💾 Deine Daten sichern</h2>
    <p class="hint" style="margin:0 0 8px">Wochenplan, Profil, Einkaufsliste und dein Kochjahr wohnen nur auf diesem Gerät. Mit einer Sicherung nimmst du sie auf ein neues Handy mit, und nichts geht verloren.</p>
    <div class="knoepfe"><button class="btn" id="sich-mach">💾 Sicherung speichern</button>
    <label class="btn soft">📂 Sicherung zurückholen<input type="file" accept=".json,application/json" class="versteckt" id="sich-hol"></label></div>
    <p class="hint" id="sich-info" style="margin:8px 0 0">${U.sicherungInfo?esc(U.sicherungInfo):'Tipp: Speicher die Sicherung in „Dateien“ oder schick sie dir selbst. Gib sie aber niemandem, da ist auch dein Zugangscode drin.'}</p></div>`;
  return `<h1>Mein Profil</h1><p class="sub">Hier trägst du ein, was die Ente über dich wissen soll.</p>
  <div class="reiter">${REITER.map(([k,i,l])=>`<button class="${k===r?'on':''}" data-reiter="${k}">${i} ${l}</button>`).join('')}</div>${inhalt}`;
}

/* ---------- Zeichnen und Speichern ---------- */
function render(){
  speichere();
  zeigeNav();
  $('#main').innerHTML=({start:seiteStart,woche:seiteWoche,mensa:seiteMensa,einkauf:seiteEinkauf,profil:seiteProfil,
    kuehl:seiteKuehl, rueckblick:seiteRueckblick,
    preis:seitePreis})[U.screen]();
  bindeSeite();
}
function bindeSeite(){
  const m=$('#main'), q=s=>m.querySelector(s), qa=s=>m.querySelectorAll(s);
  qa('[data-go]').forEach(b=>b.onclick=()=>geh(b.dataset.go));
  qa('[data-mgo]').forEach(b=>b.onclick=()=>{const [id,d]=b.dataset.mgo.split('|'); U.mensa=+id; U.datum=d; geh('mensa');});
  if(U.screen==='woche') bindeWoche();
  if(U.screen==='profil') bindeProfil(q,qa);
  if(U.screen==='einkauf') bindeEinkauf(q,qa);
  if(U.screen==='kuehl') bindeKuehl(q,qa);
  if(U.screen==='preis') bindePreis(q);
  if(U.screen==='mensa'){
    const an=q('.mzeile .on'); if(an) an.scrollIntoView({block:'nearest',inline:'center'});
    qa('[data-mz]').forEach(b=>b.onclick=()=>{U.mensa=+b.dataset.mz; U.datum=null; render();});
    qa('[data-tg]').forEach(b=>b.onclick=()=>{U.datum=b.dataset.tg; render();});
    if(q('#nochmal')) q('#nochmal').onclick=()=>{ Object.keys(MC).forEach(k=>{if(MC[k].status==='fehler') delete MC[k]}); Object.keys(MD).forEach(k=>{if(MD[k].status==='fehler') delete MD[k]}); render(); };
    if(q('#inplan')) q('#inplan').onclick=()=>{ const id=U.mensa||S.profil.mensa, td=MD[id], d=U.datum&&td.tage.includes(U.datum)?U.datum:td.tage[0];
      einfuegen(S.plan,tagVonDatum(d),99,neuerBlock('mensa',mensaName(id))); speichere(); q('#inplan').textContent='✓ Im Wochenplan'; q('#inplan').disabled=true; };
  }
}
function bindeCode(q){
  if(!q('#kok')) return;
  const go=()=>{ const c=q('#kcode').value.replace(/\s+/g,'').toLowerCase();
    if(!/^[A-Za-z0-9_-]{4,64}$/.test(c)){ q('#kfehl').textContent='Der Code besteht nur aus Buchstaben und Zahlen. Schau nochmal auf die Karte.'; return; }
    S.kicode=c; U.kuehl={status:'leer'}; U.preis={status:'leer'}; render(); };
  q('#kok').onclick=go; q('#kcode').onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault();go()} };
}
function bindeKuehl(q,qa){
  bindeCode(q);
  qa('[data-foto]').forEach(i=>i.onchange=()=>{ const f=i.files&&i.files[0]; i.value=''; kuehlFoto(f); });
  const E=S.kuehl, er=()=>(U.kuehl.erledigt=U.kuehl.erledigt||{});
  qa('[data-rfehlt]').forEach(b=>b.onclick=()=>{ const n=fehlendeHinzu(S.einkauf,E.rezepte[+b.dataset.rfehlt].fehlt); er()['f'+b.dataset.rfehlt]=n?n+(n===1?' Sache':' Sachen')+' auf der Liste':'Schon auf der Liste'; render(); });
  qa('[data-rplan]').forEach(b=>b.onclick=()=>{ einfuegen(S.plan,tagHeute(new Date()),99,neuerBlock('kochen',E.rezepte[+b.dataset.rplan].titel.slice(0,120))); er()['p'+b.dataset.rplan]=true; render(); });
}
function bindePreis(q){
  bindeCode(q);
  if(q('#bq')){ const b=q('#bq');   // nur die Knöpfe neu zeichnen, damit die Tastatur offen bleibt
    b.oninput=()=>{ U.buch=b.value; const L=buchLinks(b.value);
      q('#blinks').innerHTML=L.length?L.map(([n,u])=>`<a class="btn soft" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${n}</a>`).join(''):'<p class="hint" style="margin:0">Tipp oben einen Buchtitel ein, dann suche ich überall gleichzeitig.</p>'; };
    b.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); b.blur(); } }; }
  if(q('#pgo')){ const go=()=>{ const prod=q('#pprod').value.trim().replace(/\s+/g,' '), link=q('#plink').value.trim(), pr=q('#ppreis').value.trim();
      if(!prod && !link){ q('#pfehl').textContent='Schreib, was du suchst, oder füg einen Link ein.'; q('#pprod').focus(); return; }
      if(link && !sichererLink(link)){ q('#pfehl').textContent='Der Link muss mit https:// anfangen.'; q('#plink').focus(); return; }
      preisCheck(prod,pr,link); };
    q('#pgo').onclick=go; q('#pprod').onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault();go()} }; }
  if(q('#pliste')) q('#pliste').onclick=()=>{ const p=parsePreis(S.preis.meinPreis);
    S.einkauf.push({n:S.preis.produkt.slice(0,60),p:Number.isNaN(p)?null:p,s:'',done:false}); U.preis.aufListe=true; render(); };
}
function bindeEinkauf(q,qa){
  qa('[data-chk]').forEach(c=>c.onchange=()=>{S.einkauf[+c.dataset.chk].done=c.checked; render();});
  qa('[data-edel]').forEach(b=>b.onclick=()=>{S.einkauf.splice(+b.dataset.edel,1); render();});
  const add=()=>{ const n=q('#en').value.trim().replace(/\s+/g,' '), p=parsePreis(q('#ep').value);
    if(!n){ q('#en').focus(); return; }
    if(Number.isNaN(p)){ q('#efehl').textContent='Der Preis sieht komisch aus. Beispiel: 1,49'; q('#ep').focus(); return; }
    S.einkauf.push({n:n.slice(0,60),p,s:q('#el')?q('#el').value:'',done:false}); render(); const e=$('#main').querySelector('#en'); if(e) e.focus(); };
  q('#ea').onclick=add; q('#en').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();add()}}; q('#ep').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();add()}};
}
function bindeProfil(q,qa){
  const P=S.profil;
  qa('[data-reiter]').forEach(b=>b.onclick=()=>{U.reiter=b.dataset.reiter;render()});
  qa('[data-add]').forEach(b=>{
    const key=b.dataset.add, inp=q(`input[data-in="${key}"]`);
    const go=()=>{ if(fuegeHinzu(P[key],inp.value.slice(0,40))){ render(); const n=$('#main').querySelector(`input[data-in="${key}"]`); if(n) n.focus(); } else inp.value=''; };
    b.onclick=go; inp.onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault();go()} };
  });
  qa('[data-rm]').forEach(b=>b.onclick=()=>{const [k,i]=b.dataset.rm.split('|'); P[k].splice(+i,1); render()});
  qa('[data-ern]').forEach(b=>b.onclick=()=>{P.ernaehrung=b.dataset.ern;render()});
  qa('[data-gs]').forEach(b=>b.onclick=()=>{P.gespraechig=b.dataset.gs;render()});
  qa('[data-mensa]').forEach(b=>b.onclick=()=>{P.mensa=+b.dataset.mensa;render()});
  qa('[data-prm]').forEach(b=>b.onclick=()=>{P.pruefungen.splice(+b.dataset.prm,1);render()});
  if(q('#padd')) q('#padd').onclick=()=>{const n=q('#pname').value.trim().slice(0,40), d=q('#pdatum').value;
    if(!n||!d){ q(!n?'#pname':'#pdatum').focus(); return; }
    P.pruefungen.push({n,d}); P.pruefungen.sort((a,b)=>a.d<b.d?-1:1); render();};
  if(q('#budget')) q('#budget').onchange=()=>{const v=parsePreis(q('#budget').value); if(v>0) S.ziel=v; render();};
  if(q('#ename')){ const e=q('#ename'); e.onchange=()=>{P.enteName=e.value.trim().slice(0,20);render()}; e.onkeydown=ev=>{if(ev.key==='Enter'){ev.preventDefault();e.blur()}}; }
  if(q('#sich-mach')) q('#sich-mach').onclick=sicherungSpeichern;
  if(q('#sich-hol')) q('#sich-hol').onchange=e=>{ const f=e.target.files&&e.target.files[0]; e.target.value=''; if(f) sicherungHolen(f); };
}
/* Sicherung: am iPhone/Android über „Teilen“ (→ In Dateien sichern), sonst als Download */
async function sicherungSpeichern(){
  const name='ente-sicherung-'+iso(new Date())+'.json', text=sicherungMachen(S,new Date());
  try{
    const f=new File([text],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:'Ente-Sicherung'}); U.sicherungInfo='Gesichert! 🦆 Gut aufheben.'; render(); return; }
  }catch(e){ if(e&&e.name==='AbortError') return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:'application/json'})); a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),10000);
  U.sicherungInfo='Gesichert als „'+name+'“ (bei den Downloads). 🦆'; render();
}
function sicherungHolen(f){
  if(f.size>2000000){ U.sicherungInfo='Die Datei ist zu groß. Ist das wirklich eine Enten-Sicherung?'; render(); return; }
  const r=new FileReader();
  r.onload=()=>{ const erg=sicherungLesen(String(r.result));
    if(erg.fehler){ U.sicherungInfo=erg.fehler; render(); return; }
    const wann=erg.datum?' vom '+new Date(erg.datum+'T12:00').toLocaleDateString('de-DE'):'';
    if(!confirm('Sicherung'+wann+' zurückholen? Alles, was jetzt in der App steht, wird dadurch ersetzt.')) return;
    const altCode=S.kicode; Object.assign(S,erg.daten); if(!S.kicode) S.kicode=altCode;
    neueWoche(S,new Date()); if(!S.seit) S.seit=iso(new Date());
    U.sicherungInfo='Zurückgeholt! Alles wieder da. Quak! 💛'; speichere(); render(); };
  r.onerror=()=>{ U.sicherungInfo='Die Datei konnte ich nicht öffnen.'; render(); };
  r.readAsText(f);
}

/* ---------- Ziehen und Ablegen (Pointer-Ereignisse: Finger und Maus) ---------- */
function bindeWoche(){
  const m=$('#main');
  m.querySelectorAll('textarea[data-t]').forEach(i=>{
    i.oninput=()=>{const f=findeBlock(S.plan,i.dataset.t); if(f){ S.plan[f.tag][f.index].text=i.value.slice(0,120); speichere(); }};
    i.onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault(); i.blur();} };
  });
  m.querySelectorAll('select[data-ms]').forEach(s=>s.onchange=()=>{const f=findeBlock(S.plan,s.dataset.ms); if(f){ S.plan[f.tag][f.index].text=mensaName(+s.value); render(); }});
  m.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{entfernen(S.plan,b.dataset.x);render()});
  m.querySelectorAll('.block.pal').forEach(el=>el.addEventListener('pointerdown',e=>start(e,el,{typ:el.dataset.typ})));
  m.querySelectorAll('.block[data-id] .grip').forEach(g=>{const el=g.closest('.block'); g.addEventListener('pointerdown',e=>start(e,el,{id:el.dataset.id}))});
}
function start(e,el,what){
  e.preventDefault();
  const g=el.cloneNode(true); g.classList.add('ghost'); document.body.appendChild(g);
  const move=(x,y)=>{g.style.left=(x-85)+'px'; g.style.top=(y-20)+'px';
    document.querySelectorAll('.dayzone').forEach(z=>z.classList.remove('over'));
    const z=zoneBei(x,y); if(z) z.classList.add('over');};
  move(e.clientX,e.clientY);
  const mv=ev=>move(ev.clientX,ev.clientY);
  const up=ev=>{
    document.removeEventListener('pointermove',mv); document.removeEventListener('pointerup',up); document.removeEventListener('pointercancel',up);
    g.remove();
    const z=ev.type==='pointercancel'?null:zoneBei(ev.clientX,ev.clientY);
    if(z){
      const idx=einfuegeIndex(z,ev.clientY);
      if(what.typ) einfuegen(S.plan,z.dataset.tag,idx,neuerBlock(what.typ,what.typ==='mensa'?mensaName(S.profil.mensa):''));
      else verschieben(S.plan,what.id,z.dataset.tag,idx);
    } else if(what.id && ev.type!=='pointercancel' && ueberPalette(ev.clientX,ev.clientY)){ entfernen(S.plan,what.id); }
    render();
  };
  document.addEventListener('pointermove',mv); document.addEventListener('pointerup',up); document.addEventListener('pointercancel',up);
}
function zoneBei(x,y){ const e=document.elementFromPoint(x,y); return e? e.closest('.dayzone'):null; }
function ueberPalette(x,y){ const e=document.elementFromPoint(x,y); return !!(e&&e.closest('#pal')); }
function einfuegeIndex(zone,y){ let i=0; for(const k of zone.querySelectorAll('.block')){ const r=k.getBoundingClientRect(); if(y>r.top+r.height/2) i++; } return i; }

/* ---------- Begrüßung (nur beim allerersten Öffnen) ---------- */
const qrCode=codeAusAdresse(location.search);
if(qrCode && S.kicode!==qrCode){ S.kicode=qrCode; speichere(); }   // Code bleibt in der Adresse: das iPhone übernimmt sie beim „Zum Home-Bildschirm“
const hp=location.hash.slice(1).split(',');
if(!S.begruesst && hp[1]!=='x'){
  $('#hallo').innerHTML=`<div class="karte">${ente('froh',130)}<h1>Alles Gute zum Geburtstag, Löttmött! 🎂</h1>
  <p>Deine Ente hat sich was für dich ausgedacht: Sie schaut in deinen Kühlschrank, plant mit dir die Woche und passt auf dein Geld auf.</p><p class="hint">Dein Kneggbert</p><button class="btn" id="los">Los geht's</button></div>`;
  $('#los').onclick=()=>{ S.begruesst=true; speichere(); $('#hallo').remove(); };
} else $('#hallo').remove();
/* Test-Einstieg: index.html#seite,x,reiter */
if(NAV.some(n=>n[0]===hp[0])||hp[0]==='rueckblick') U.screen=hp[0];
if(hp[2]&&REITER.some(r=>r[0]===hp[2])) U.reiter=hp[2];
/* Kommt sie nach Tagen zurück (App war im Hintergrund), neue Woche prüfen und neu zeichnen */
let gezeichnetAm=iso(new Date());
document.addEventListener('visibilitychange',()=>{ if(document.hidden) return; const h=new Date(), neu=neueWoche(S,h);
  if((neu||iso(h)!==gezeichnetAm) && !(document.activeElement&&document.activeElement.matches('input,textarea,select'))){ gezeichnetAm=iso(h); render(); } });
render();
}
